[project]
name = "tavily-ai-tutor"
version = "0.1.0"
description = "A grounded AI tutor built with Tavily, LangChain, Nebius, and LangSmith."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "langchain>=1.3.15,<2",
    "langchain-nebius>=0.1.3,<0.2",
    "langchain-tavily>=0.2.18,<0.3",
    "langsmith>=0.11,<1",
    "python-dotenv>=1.2,<2",
    "rich>=14,<15",
    "typer>=0.21,<1",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
